version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careflow_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-careflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careflow_user} -d ${POSTGRES_DB:-careflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careflow_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-careflow_user}:${POSTGRES_PASSWORD:-careflow_password}@postgres:5432/${POSTGRES_DB:-careflow_db}
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:80"]}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careflow_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
