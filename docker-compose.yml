version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careflow_postgres
    restart: always
    environment:
      POSTGRES_DB: careflow_db
      POSTGRES_USER: careflow_user
      POSTGRES_PASSWORD: careflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow_user -d careflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careflow_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://careflow_user:careflow_password@postgres:5432/careflow_db
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
